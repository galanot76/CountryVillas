name: Monitor de salud web - HEARTBEAT SEMANAL (Country Villas Lanzarote)

on:
  schedule:
    - cron: "0 8 * * 1"       # lunes 8:00, hora de Canarias (ajuste de DST automatico via timezone)
      timezone: "Atlantic/Canary"
  workflow_dispatch: {}       # permite lanzarlo a mano desde la pestaña Actions, para probar

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar heartbeat semanal (solo lectura, no toca el estado de alertas)
        env:
          SITE_MONITOR_MODE: heartbeat
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_MONITOR_EMAIL_FROM: ${{ secrets.SITE_MONITOR_EMAIL_FROM }}
          SITE_MONITOR_EMAIL_TO: ${{ secrets.SITE_MONITOR_EMAIL_TO }}
        run: python site_monitor.py
